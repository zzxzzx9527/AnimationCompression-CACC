[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-control-codec"
version = "0.1.0"
description = "Causal codec for facial and skeletal animation control streams"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avatar_codec = ["_bin/*.dll", "_bin/*.pyd"]

